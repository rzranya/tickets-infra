name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Validate firebase.json / .firebaserc are valid JSON
        run: |
          python3 -c "import json; json.load(open('firebase.json'))"
          python3 -c "import json; json.load(open('.firebaserc'))"
